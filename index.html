<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armindo Neto - Portfolio</title>

  <!-- Ícone da página (Favicon) -->
  <link rel="icon" type="image/png" href="assets/icon.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background:
        radial-gradient(800px 500px at 50% -10%, rgba(255, 215, 0, 0.12), transparent 65%),
        #0a0a0a;
      background-attachment: fixed;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      padding: 56px 20px 20px 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 44px;
      color: #ffd700;
      text-shadow: 0 0 24px rgba(255, 215, 0, 0.35);
    }

    /* Grid: 2 colunas, banners largos ocupam a linha toda */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .banner-btn {
      display: block;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.35);
      background-color: #111;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .banner-btn:hover {
      transform: translateY(-4px);
      border-color: #ffd700;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.75), 0 0 24px rgba(255, 215, 0, 0.25);
    }

    .banner-btn:focus-visible {
      outline: 3px solid #ffd700;
      outline-offset: 3px;
    }

    .banner-btn img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Logos quadrados: três lado a lado, imagem inteira centralizada */
    .banner-btn.logo {
      grid-column: span 2;
      aspect-ratio: 16 / 10;
      background: radial-gradient(circle at 50% 50%, #1d1a0a 0%, #0c0c0c 80%);
    }

    .banner-btn.logo img {
      object-fit: contain;
      padding: 18px;
    }

    /* Banners largos: dois lado a lado, recorte centralizado */
    .banner-btn.wide {
      grid-column: span 3;
      aspect-ratio: 2.6 / 1;
    }

    .banner-btn.wide img {
      object-fit: cover;
      object-position: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255, 215, 0, 0.7);
      letter-spacing: 1px;
    }

    /* Mobile compacto: tudo cabe numa tela só, sem rolagem */
    @media (max-width: 640px) {
      html, body { height: 100%; overflow: hidden; }
      body {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        padding: 22px 14px 10px 14px;
      }
      h1 { font-size: clamp(2rem, 9.5vw, 2.7rem); margin-bottom: 18px; }
      .grid-container { gap: 10px; }
      .banner-btn { border-radius: 14px; }
      .banner-btn.logo { aspect-ratio: 1 / 1; max-height: 17dvh; }
      .banner-btn.logo img { padding: 10px; }
      .banner-btn.wide { grid-column: 1 / -1; aspect-ratio: 2.4 / 1; max-height: 21dvh; }
      footer { margin-top: 12px; font-size: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner-btn { transition: none; }
    }
  </style>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <main>
    <h1>Portfolio</h1>

    <div class="grid-container">
      <!-- Botão 1: Nexus -->
      <a href="https://thenexus.ai.studio/" target="_blank" rel="noopener" class="banner-btn logo">
        <img src="assets/nexus.png" alt="Nexus" />
      </a>

      <!-- Botão 2: Escalas PCO -->
      <a href="https://escalas-pco.vercel.app/" target="_blank" rel="noopener" class="banner-btn logo">
        <img src="assets/pco.png" alt="Escalas PCO" />
      </a>

      <!-- Botão 3: Beamshare -->
      <a href="https://beamshare-files.vercel.app/" target="_blank" rel="noopener" class="banner-btn logo">
        <img src="assets/beamshare.png" alt="Beamshare" />
      </a>

      <!-- Botão 4: Bolão ACCRE -->
      <a href="https://bolao-accre-2026.vercel.app/" target="_blank" rel="noopener" class="banner-btn wide">
        <img src="assets/bras.png" alt="Bolão ACCRE 2026" />
      </a>

      <!-- Botão 5: Bolão Copa -->
      <a href="https://bolao-copa2026-indol.vercel.app/" target="_blank" rel="noopener" class="banner-btn wide">
        <img src="assets/copa.png" alt="Bolão Copa 2026" />
      </a>
    </div>
  </main>

  <footer>
    2026 - Armindo Neto
  </footer>

</body>
</html>
