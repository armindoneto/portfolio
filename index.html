<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armindo Neto - Portfolio</title>
  
  <!-- Ícone da página (Favicon) -->
  <link rel="icon" type="image/png" href="assets/icon.png" />

  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(circle at top, #1c1a00 0%, #0a0a0a 70%, #000000 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      padding: 40px 20px 20px 20px;
    }

    /* Conteúdo principal */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Título principal */
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    /* Grid dos botões */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    /* Estilo dos Botões/Links */
    .banner-btn {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #ffd700;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      background-color: #141414;
      text-decoration: none;
    }

    .banner-btn:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #fff066;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 215, 0, 0.4);
    }

    /* Imagens dentro dos botões */
    .banner-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Estilo do Rodapé */
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255, 215, 0, 0.7);
      letter-spacing: 1px;
    }
  </style>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <main>
    <h1>Portfolio</h1>

    <div class="grid-container">
      <!-- Botão 1: Nocturne -->
      <a href="https://nocturne-205729277725.us-west2.run.app/" target="_blank" class="banner-btn">
        <img src="assets/nocturne.png" alt="Nocturne" />
      </a>

      <!-- Botão 2: Escalas PCO -->
      <a href="https://escalas-pco.vercel.app/" target="_blank" class="banner-btn">
        <img src="assets/escalas.png" alt="Escalas PCO" />
      </a>

      <!-- Botão 3: Bolão ACCRE -->
      <a href="https://bolao-accre-2026.vercel.app/" target="_blank" class="banner-btn">
        <img src="assets/bras.png" alt="Bolão ACCRE 2026" />
      </a>

      <!-- Botão 4: Bolão Copa -->
      <a href="https://bolao-copa2026-indol.vercel.app/" target="_blank" class="banner-btn">
        <img src="assets/copa.png" alt="Bolão Copa 2026" />
      </a>
    </div>
  </main>

  <footer>
    2026 - Armindo Neto
  </footer>

</body>
</html>
